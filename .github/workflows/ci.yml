name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier_test
      DATABASE_URL_UNPOOLED: postgresql://atelier:atelier@localhost:5432/atelier_test
      TEST_DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier_test
      SESSION_SECRET: ci-session-secret-not-for-production
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - name: Integration tests
        run: npm run test:integration
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Upload e2e screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts
